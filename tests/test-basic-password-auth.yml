name: Test basic password auth inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "127.0.0.1"
          port: "22"
          username: "testuser"
          password: "testpassword"
          protocol: "tcp"
          timeout: "5s"
          command_timeout: "1m"
          debug: "true"
          script: "echo hello"
      - name: Assert action ran (connection expected to fail in test env)
        run: |
          echo "Action completed (with or without error - no real SSH server)"
          echo "PASS: inputs were accepted"
