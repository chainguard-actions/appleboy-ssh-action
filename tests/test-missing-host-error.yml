name: Test error handling when host is missing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action without host (should fail)
        uses: .
        continue-on-error: true
        with:
          username: "testuser"
          password: "testpassword"
          script: "echo hello"
          timeout: "5s"
          command_timeout: "10s"

      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no host is provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when no host is provided"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
