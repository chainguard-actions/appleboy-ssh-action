name: Test SSH connection timeout
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with unreachable host (should fail with timeout)
        uses: .
        continue-on-error: true
        with:
          host: "192.0.2.1"
          port: "22"
          username: "testuser"
          password: "testpassword"
          script: "echo hello"
          timeout: "5s"
          command_timeout: "10s"

      - name: Assert action failed due to connection timeout
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when connecting to unreachable host"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when connecting to unreachable host"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
