name: Test basic SSH inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "127.0.0.1"
          port: "22"
          username: "testuser"
          password: "testpassword"
          protocol: "tcp"
          timeout: "10s"
          command_timeout: "5m"
          script: "echo hello"
          debug: "true"
          sync: "true"
          use_insecure_cipher: "false"
          cipher: ""
          request_pty: "false"
          capture_stdout: "false"
          allenvs: "false"
          envs: "MY_VAR=hello"
          envs_format: ""
          curl_insecure: "false"
          version: ""
      - name: Assert action ran (connection expected to fail without real server)
        run: |
          echo "Action completed with continue-on-error (SSH connection to localhost expected to fail)"
          echo "PASS: all basic inputs were accepted"
