name: Test key-based auth and PTY options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy key file for key_path input
        run: |
          mkdir -p /tmp/ssh-test
          ssh-keygen -t ed25519 -f /tmp/ssh-test/id_ed25519 -N "testpassphrase" -C "test@example.com"
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "192.0.2.1"
          username: "testuser"
          port: "22"
          key_path: "/tmp/ssh-test/id_ed25519"
          passphrase: "testpassphrase"
          fingerprint: "SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          request_pty: "true"
          allenvs: "true"
          envs_format: "export %s=%s"
          timeout: "5s"
          command_timeout: "10s"
          script: "echo hello"
      - name: Assert action ran (connection refused is expected for TEST-NET addresses)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real SSH server available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real SSH server)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
