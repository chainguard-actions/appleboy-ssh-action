name: Test proxy SSH inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "127.0.0.1"
          port: "22"
          username: "testuser"
          password: "testpassword"
          script: "echo hello"
          proxy_host: "proxy.example.com"
          proxy_port: "22"
          proxy_username: "proxyuser"
          proxy_password: "proxypassword"
          proxy_passphrase: "proxypassphrase"
          proxy_key: "fake-proxy-key-content"
          proxy_key_path: "/tmp/fake_proxy_key"
          proxy_fingerprint: "SHA256:fakeproxyfingerprint"
          proxy_cipher: "aes128-ctr"
          proxy_use_insecure_cipher: "false"
          proxy_protocol: "tcp"
          proxy_timeout: "30s"
      - name: Assert proxy inputs were accepted
        run: |
          echo "Action completed with continue-on-error"
          echo "PASS: All proxy inputs were accepted by the action"
