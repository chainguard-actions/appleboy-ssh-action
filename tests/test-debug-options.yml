name: Test debug and cipher options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "127.0.0.1"
          username: "testuser"
          password: "testpass"
          port: "22"
          debug: "true"
          use_insecure_cipher: "true"
          cipher: "aes128-ctr"
          sync: "true"
          version: "1.3.0"
          timeout: "5s"
          command_timeout: "10s"
          script: "echo hello"
      - name: Assert action ran (connection refused is expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real SSH server available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real SSH server)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
