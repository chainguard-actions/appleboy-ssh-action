name: Test key-based auth inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy key file
        run: |
          mkdir -p /tmp/ssh-test
          ssh-keygen -t rsa -b 2048 -f /tmp/ssh-test/id_rsa -N "testpassphrase" -q
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "127.0.0.1"
          port: "22"
          username: "testuser"
          key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAMKCMDHBFMFMNNFMFMNF\n-----END RSA PRIVATE KEY-----"
          key_path: "/tmp/ssh-test/id_rsa"
          passphrase: "testpassphrase"
          fingerprint: "SHA256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          use_insecure_cipher: "false"
          cipher: "aes128-ctr"
          request_pty: "false"
          script: "echo hello"
      - name: Assert action ran (connection expected to fail in test env)
        run: |
          echo "Action completed (with or without error - no real SSH server)"
          echo "PASS: key-based auth inputs were accepted"
