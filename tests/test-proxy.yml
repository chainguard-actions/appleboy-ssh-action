name: Test proxy SSH inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "127.0.0.1"
          port: "22"
          username: "testuser"
          password: "testpassword"
          script: "echo hello"
          proxy_host: "127.0.0.2"
          proxy_port: "22"
          proxy_username: "proxyuser"
          proxy_password: "proxypassword"
          proxy_passphrase: "proxypassphrase"
          proxy_key: ""
          proxy_key_path: ""
          proxy_fingerprint: ""
          proxy_cipher: ""
          proxy_use_insecure_cipher: "false"
          proxy_protocol: "tcp"
          proxy_timeout: "5s"
          timeout: "5s"
          command_timeout: "1m"
      - name: Assert action ran (connection expected to fail in test env)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail since there's no real SSH server
          # We just verify the action was invoked (not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
