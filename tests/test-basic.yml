name: Test basic SSH inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          host: "127.0.0.1"
          port: "22"
          username: "testuser"
          password: "testpassword"
          passphrase: "testpassphrase"
          key: ""
          key_path: ""
          fingerprint: ""
          protocol: "tcp"
          timeout: "5s"
          command_timeout: "1m"
          script: "echo hello"
          script_path: ""
          envs: "FOO=bar,BAZ=qux"
          envs_format: ""
          debug: "true"
          allenvs: "false"
          request_pty: "false"
          use_insecure_cipher: "false"
          cipher: ""
          sync: "false"
          capture_stdout: "true"
          curl_insecure: "false"
          version: ""
      - name: Assert action ran (connection expected to fail in test env)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail since there's no real SSH server
          # We just verify the action was invoked (not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
